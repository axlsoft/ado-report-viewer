name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.release_tag }} to the Marketplace
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got '$RELEASE_TAG')."
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # The tagged sources provide the publish script and manifest that match the released VSIX.
      - name: Checkout ${{ inputs.release_tag }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.vsix' \
            --dir release \
            --clobber

      - name: Publish
        run: node scripts/extension.ts publish
        env:
          EXTENSION_PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          EXTENSION_SHARE_WITH: ${{ vars.EXTENSION_SHARE_WITH }}
          EXTENSION_VERSION: ${{ steps.tag.outputs.version }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
