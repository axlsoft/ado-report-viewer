name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser tests run in Chromium, Firefox, and WebKit.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Build (type check and bundle budgets)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Packaging is only verified here. Runs triggered by Dependabot cannot read Actions variables,
      # so a placeholder publisher stands in when EXTENSION_PUBLISHER is unavailable.
      - name: Package and verify VSIX
        run: npm run package && npm run verify:vsix
        env:
          EXTENSION_PUBLISHER: ${{ vars.EXTENSION_PUBLISHER || 'ci-placeholder' }}
