<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Report</title>
    <script>
      // Host for one report document, loaded from the extension origin inside an opaque-origin sandbox.
      // The report is written into this same browsing context (rather than a srcdoc frame) so that
      // `location` is a real hierarchical URL: reports that build URLs from `location.href` or route
      // with the history API work, and back/forward between report pages uses native frame history.
      // Blob URLs created here belong to this document, so they stay valid for the report's lifetime.
      (function () {
        addEventListener("message", function render(event) {
          var data = event.data;
          if (event.source !== parent || !data || data.type !== "render-document" || typeof data.html !== "string") {
            return;
          }
          removeEventListener("message", render);
          var urls = {};
          var replaceTokens = function (text) {
            return text.replace(/__report_resource_\d+__/g, function (token) {
              return urls[token] || token;
            });
          };
          data.resources.forEach(function (resource) {
            var blob = typeof resource.css === "string" ? new Blob([replaceTokens(resource.css)], { type: "text/css" }) : resource.blob;
            urls[resource.token] = URL.createObjectURL(blob);
          });
          document.open();
          document.write(replaceTokens(data.html));
          document.close();
        });
        parent.postMessage({ type: "document-ready", search: location.search }, "*");
      })();
    </script>
  </head>
  <body></body>
</html>
